<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-labelledby="title description">
  <title id="title">QueueLab: same ticket, different evidence</title>
  <desc id="description">One missing export ticket can point to a disabled schedule, the wrong delivery folder, or missing records. QueueLab plans to compare the same model before and after fine-tuning, scoring decisions against the evidence it saw.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#faf7ee"/>
      <stop offset="1" stop-color="#f3eee1"/>
    </linearGradient>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .ink { fill: #1c342e; }
      .body { fill: #42564e; font-size: 19px; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.9px; }
      .card-title { fill: #162f27; font-size: 27px; }
      .next { fill: #1e5847; font-size: 17px; font-weight: 700; }
      .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="708" rx="28" fill="url(#paper)" stroke="#ddd6c6" stroke-width="2"/>
  <circle cx="82" cy="56" r="19" fill="#285a48"/>
  <path d="M76 55a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0m9.6 4 3.8 3.8" class="icon" stroke="#f5faed"/>
  <text x="114" y="63" class="sans ink" font-size="22" font-weight="700" letter-spacing="-.5">QueueLab</text>
  <rect x="934" y="39" width="202" height="35" rx="17.5" fill="#e8ecdb" stroke="#d3dcc9"/>
  <circle cx="953" cy="56.5" r="3.5" fill="#467459"/>
  <text x="966" y="61" class="sans label" fill="#315543" style="letter-spacing:1.2px">DEVELOPMENT PILOT</text>

  <text x="64" y="136" class="serif ink" font-size="56" letter-spacing="-2.2">Same ticket.<tspan fill="#27624e" dx="16">Different evidence.</tspan></text>
  <text x="66" y="174" class="sans body" font-size="21">Can a small AI model learn what to check before it recommends a fix?</text>

  <rect x="64" y="210" width="1072" height="101" rx="22" fill="#234b3e"/>
  <rect x="89" y="234" width="50" height="50" rx="16" fill="#345f4e"/>
  <path d="M104 249h20a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3h-11l-6 5v-5h-3a3 3 0 0 1-3-3v-11a3 3 0 0 1 3-3z m3 7h13m-13 5h9" class="icon" stroke="#d8e9ce" transform="translate(0 -2)"/>
  <text x="158" y="248" class="sans label" fill="#bcd4bb">CUSTOMER TICKET</text>
  <text x="157" y="280" class="serif" fill="#fffaf0" font-size="29">“Our nightly export stopped arriving after the upgrade.”</text>

  <text x="65" y="352" class="sans ink label">THREE POSSIBLE INVESTIGATIONS</text>
  <text x="1135" y="352" text-anchor="end" class="sans" fill="#546c61" font-size="16">The same complaint in each case</text>

  <rect x="64" y="373" width="342" height="208" rx="22" fill="#fcfaf4" stroke="#dcd7c7" stroke-width="1.4"/>
  <circle cx="96" cy="410" r="17" fill="#e2eee0"/>
  <path d="M89 405h14v12H89zm3-2v4m8-4v4m-11 2h14m-10 4h3" class="icon" stroke="#32644e"/>
  <text x="122" y="414" class="sans label" fill="#3d6555">01 / SCHEDULE</text>
  <text x="84" y="457" class="serif card-title">The export didn’t run.</text>
  <text x="84" y="489" class="sans body">No run after the upgrade.</text>
  <text x="84" y="514" class="sans body">The schedule is disabled.</text>
  <path d="M85 531h300" stroke="#e5e0d3"/>
  <text x="84" y="557" class="sans next">→ Review and re-enable the schedule</text>

  <rect x="429" y="373" width="342" height="208" rx="22" fill="#fcfaf4" stroke="#dcd7c7" stroke-width="1.4"/>
  <circle cx="461" cy="410" r="17" fill="#e2eee0"/>
  <path d="M453 406h6l2 2h8v8h-16zm4 6h8m-3-2 3 2-3 2" class="icon" stroke="#32644e"/>
  <text x="487" y="414" class="sans label" fill="#3d6555">02 / DELIVERY</text>
  <text x="449" y="457" class="serif card-title">It went to the old folder.</text>
  <text x="449" y="489" class="sans body">Run history shows it completed.</text>
  <text x="449" y="514" class="sans body">Receipt and expected folder differ.</text>
  <path d="M450 531h300" stroke="#e5e0d3"/>
  <text x="449" y="557" class="sans next">→ Recommend correcting the folder</text>

  <rect x="794" y="373" width="342" height="208" rx="22" fill="#fbf5e8" stroke="#e2d2b6" stroke-width="1.4"/>
  <circle cx="826" cy="410" r="17" fill="#f1e3c7"/>
  <path d="M821 402h7l4 4v12h-11zm7 0v5h4m-8 5h5m-5 3h3" class="icon" stroke="#87602f"/>
  <text x="852" y="414" class="sans label" fill="#7e5b30">03 / MISSING RECORDS</text>
  <text x="814" y="457" class="serif card-title">We can’t tell yet.</text>
  <text x="814" y="489" class="sans body">Run history has expired.</text>
  <text x="814" y="514" class="sans body">No delivery receipt is available.</text>
  <path d="M815 531h300" stroke="#e8dcc5"/>
  <text x="814" y="557" class="sans next" fill="#755225">→ Escalate and name the next check</text>

  <path d="M64 613h1072" stroke="#d9d2c1"/>
  <text x="65" y="643" class="sans label" fill="#3b6454">THE PLANNED COMPARISON</text>
  <text x="64" y="674" class="serif ink" font-size="25">One model, before and after fine-tuning.</text>
  <text x="1136" y="671" text-anchor="end" class="sans body">Same tickets and tools. Check each decision against the evidence.</text>
</svg>
