<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="632" viewBox="0 0 1200 632" role="img" aria-labelledby="title description">
  <title id="title">QueueLab’s post-training experiment</title>
  <desc id="description">Engineering support example: a missing nightly export. Reviewed investigations train a small adapter. The base model with and without that adapter faces the same tickets and tools. Example scores of 36 out of 60 and 48 out of 60 are illustrative. A win requires a reliable gain in evidence-backed decisions without more unsupported claims.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#162e28"/>
      <stop offset="1" stop-color="#102720"/>
    </linearGradient>
    <linearGradient id="amber" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffe5aa"/>
      <stop offset="1" stop-color="#e7ab56"/>
    </linearGradient>
    <g id="core" fill="none" stroke="#b5dbc0" stroke-width="1.7">
      <path d="M-18-12h36m-36 24h36m-36-24v24M18-12v24M-18-12 18 12M-18 12 18-12" opacity=".62"/>
      <circle cx="-18" cy="-12" r="3.8" fill="#c7e6c9"/>
      <circle cx="18" cy="-12" r="3.8" fill="#c7e6c9"/>
      <circle cx="-18" cy="12" r="3.8" fill="#c7e6c9"/>
      <circle cx="18" cy="12" r="3.8" fill="#c7e6c9"/>
      <circle r="4.5" fill="#f2f1d7"/>
    </g>
    <g id="chip">
      <rect x="-22" y="-18" width="44" height="36" rx="9" fill="url(#amber)" stroke="#ffdc93"/>
      <path d="M-6 0H6m-6-6V6" fill="none" stroke="#483516" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g id="ticket" fill="none" stroke="#c4e5cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-13-10h26v6a4 4 0 0 0 0 8v6h-26V4a4 4 0 0 0 0-8z"/><path d="M-6-3h12m-12 6h8"/>
    </g>
    <g id="evidence" fill="none" stroke="#c4e5cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-7-10h15l5 5V10H-7zm15 0v5h5M-2 0h9m-9 5h7M-9 5h-4v-16h10"/>
    </g>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .label { font-weight: 700; font-size: 14px; letter-spacing: 1.45px; }
      .small { font-size: 16px; }
      .paper { fill: #f7f1dc; }
      .mint { fill: #b3d6bd; }
      .panel { fill: #1e3b31; stroke: #37594a; stroke-width: 1.25; }
      .line { fill: none; stroke: #80ad93; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="630" rx="27" fill="url(#night)" stroke="#345649" stroke-width="2"/>
  <circle cx="57" cy="46" r="6" fill="#bde1c1"/>
  <text x="75" y="51" class="sans label mint">QUEUELAB / POST-TRAINING</text>
  <text x="1150" y="47" text-anchor="end" class="sans label" fill="#f1d79a">ENGINEERING SUPPORT CASE</text>
  <text x="1150" y="73" text-anchor="end" class="sans small paper">Missing nightly export</text>
  <text x="49" y="126" class="serif paper" font-size="59" letter-spacing="-1.7">Can we teach it to check first?</text>

  <rect x="50" y="169" width="299" height="350" rx="22" class="panel"/>
  <rect x="379" y="169" width="313" height="350" rx="22" class="panel"/>
  <rect x="722" y="169" width="428" height="350" rx="22" class="panel"/>
  <text x="74" y="207" class="sans label mint">01 / TRAIN</text>
  <text x="403" y="207" class="sans label mint">02 / CHANGE ONE THING</text>
  <text x="746" y="207" class="sans label mint">03 / TEST BOTH</text>
  <text x="73" y="247" class="serif paper" font-size="28">Reviewed examples</text>
  <text x="402" y="247" class="serif paper" font-size="28">Same base model</text>
  <text x="745" y="247" class="serif paper" font-size="28">Same tickets &amp; tools</text>

  <g id="examples">
    <rect x="116" y="282" width="172" height="105" rx="12" fill="#365749" stroke="#567c66" transform="rotate(10 202 334)"/>
    <rect x="101" y="282" width="172" height="105" rx="12" fill="#4d6a55" stroke="#7e9c79" transform="rotate(-8 187 334)"/>
    <rect x="113" y="276" width="172" height="112" rx="13" fill="#ecedd6" stroke="#d2dec1"/>
    <path d="M139 310h119m-119 23h119m-119 23h119" stroke="#cad7bf" stroke-width="13" stroke-linecap="round"/>
    <path d="m140 310 4 4 8-9m-12 28 4 4 8-9m-12 28 4 4 8-9" fill="none" stroke="#326044" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M169 310h58m-58 23h76m-76 23h47" stroke="#6d947a" stroke-width="2.25" stroke-linecap="round"/>
  </g>
  <path d="M199 393v30m-4-6 4 6 4-6" class="line" stroke-dasharray="2 4"/>
  <g id="adapter-origin" transform="translate(199 449)"><use href="#chip"/></g>
  <text x="199" y="493" text-anchor="middle" class="sans small" fill="#f1d79a">Train a small adapter</text>

  <path d="M662 326h112m-7-5 7 5-7 5M662 443h112m-7-5 7 5-7 5" class="line"/>
  <rect x="403" y="287" width="258" height="78" rx="16" fill="#25463a" stroke="#537b64"/>
  <rect x="403" y="404" width="258" height="78" rx="16" fill="#25463a" stroke="#537b64"/>
  <text x="423" y="322" class="sans paper" font-size="22" font-weight="700">Before</text>
  <text x="423" y="346" class="sans small mint">Unchanged</text>
  <text x="423" y="439" class="sans paper" font-size="22" font-weight="700">After</text>
  <text x="423" y="463" class="sans small" fill="#f1d79a">Add adapter</text>
  <rect x="548" y="300" width="70" height="52" rx="13" fill="#18362c" stroke="#50735e"/>
  <rect x="548" y="417" width="70" height="52" rx="13" fill="#18362c" stroke="#50735e"/>
  <use href="#core" transform="translate(583 326)"/>
  <use href="#core" transform="translate(583 443)"/>
  <g id="adapter-attached" transform="translate(629 443) scale(.75)"><use href="#chip"/></g>

  <g id="compare">
    <path d="M832 326h65m-6-5 6 5-6 5M955 326h64m-7-5 7 5-7 5M832 443h65m-6-5 6 5-6 5M955 443h64m-7-5 7 5-7 5" class="line"/>
    <rect x="777" y="299" width="54" height="54" rx="14" fill="#25463a" stroke="#66937b"/>
    <rect x="777" y="416" width="54" height="54" rx="14" fill="#25463a" stroke="#66937b"/>
    <rect x="900" y="299" width="54" height="54" rx="14" fill="#25463a" stroke="#66937b"/>
    <rect x="900" y="416" width="54" height="54" rx="14" fill="#25463a" stroke="#66937b"/>
    <use href="#ticket" transform="translate(804 326)"/>
    <use href="#ticket" transform="translate(804 443)"/>
    <use href="#evidence" transform="translate(927 326)"/>
    <use href="#evidence" transform="translate(927 443)"/>
    <rect x="1023" y="299" width="105" height="54" rx="14" fill="#22392e" stroke="#b8c5a0" stroke-width="1.6"/>
    <rect x="1023" y="416" width="105" height="54" rx="14" fill="#354637" stroke="#c6b37e" stroke-width="1.6"/>
    <g id="score-wait" opacity="0" text-anchor="middle" class="sans mint" font-size="23">
      <text x="1075.5" y="333">···</text>
      <text x="1075.5" y="450">···</text>
    </g>
    <g id="score-numbers" text-anchor="middle" class="sans" font-size="24" font-weight="700">
      <text x="1075.5" y="334" class="paper">36 / 60</text>
      <text x="1075.5" y="451" fill="#ffe3a6">48 / 60</text>
    </g>
    <text x="804" y="494" text-anchor="middle" class="sans small mint">Ticket</text>
    <text x="927" y="494" text-anchor="middle" class="sans small mint">Records</text>
    <text x="1075.5" y="494" text-anchor="middle" class="sans small mint">Example score</text>
  </g>

  <g id="motion"/>
  <path d="M50 545h1100" stroke="#355648"/>
  <text x="50" y="572" class="sans label mint">WHAT COUNTS</text>
  <text x="50" y="600" class="sans paper" font-size="20">Right next step, backed by evidence.</text>
  <text x="620" y="572" class="sans label" fill="#f1d79a">WHAT WOULD COUNT AS A WIN</text>
  <text x="620" y="600" class="sans paper" font-size="20">A reliable gain, with no rise in unsupported claims.</text>
</svg>
