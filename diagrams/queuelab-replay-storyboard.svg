<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 548" width="1080" height="548" role="img" aria-labelledby="title description">
  <title id="title">Same complaint, different next steps</title>
  <desc id="description">In two fictional versions of the same export ticket, a scripted checklist reads different records. A switched-off schedule calls for reviewing the schedule. A successful export to the old folder calls for correcting the delivery folder.</desc>
  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .ink { fill: #18362c; }
    .mute { fill: #496056; }
    .label { font-weight: 700; font-size: 15px; letter-spacing: 1.6px; }
    .evidence { font-size: 21px; fill: #304c40; }
    .decision { font-size: 21px; font-weight: 700; fill: #173f33; }
  </style>

  <rect x="1" y="1" width="1078" height="546" rx="24" fill="#f8f4eb" stroke="#ddd6c6" stroke-width="2"/>
  <text x="48" y="46" class="sans label ink">QUEUELAB  /  SCRIPTED EXAMPLE</text>
  <text x="1032" y="46" text-anchor="end" class="sans label mute">STEP <tspan id="step">3</tspan> OF 3</text>
  <text x="46" y="111" class="serif ink" font-size="46" letter-spacing="-1.3">Same complaint, different next steps.</text>

  <rect x="48" y="135" width="984" height="81" rx="17" fill="#234b3e"/>
  <text x="69" y="165" class="sans label" fill="#c5dfc5">CUSTOMER TICKET</text>
  <text x="68" y="196" class="serif" fill="#fffdf5" font-size="27">“Our nightly export stopped arriving after the upgrade.”</text>

  <text x="48" y="255" class="sans ink" font-size="22" font-weight="700" id="scene">The records change. The advice changes.</text>

  <g id="intro" display="none">
    <rect x="48" y="276" width="984" height="209" rx="18" fill="#fffdf6" stroke="#ded9cc" stroke-width="1.5"/>
    <text x="540" y="359" text-anchor="middle" class="serif ink" font-size="36">First, did the export run?</text>
    <text x="540" y="403" text-anchor="middle" class="sans mute" font-size="24">The customer’s message doesn’t tell us. The run history can.</text>
  </g>

  <g id="version-a">
    <rect x="48" y="276" width="477" height="209" rx="18" fill="#fffdf6" stroke="#ded9cc" stroke-width="1.5"/>
    <text x="68" y="310" class="sans label mute">VERSION A</text>
    <text x="67" y="348" class="serif ink" font-size="31">The export didn’t run.</text>
    <text x="68" y="380" class="sans evidence">Run history: no run since the upgrade.</text>
    <text x="68" y="409" class="sans evidence">Schedule: switched off.</text>
    <rect x="66" y="434" width="441" height="35" rx="9" fill="#e8efdd"/>
    <text x="78" y="458" class="sans decision">→ Review and re-enable the schedule</text>
  </g>

  <g id="waiting-b" display="none">
    <rect x="555" y="276" width="477" height="209" rx="18" fill="#f4f0e6" stroke="#b5c3b6" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="575" y="310" class="sans label mute">VERSION B</text>
    <text x="574" y="365" class="serif ink" font-size="31">What if it did run?</text>
    <text x="575" y="406" class="sans evidence">Same complaint. Check the records again.</text>
  </g>

  <g id="version-b">
    <rect x="555" y="276" width="477" height="209" rx="18" fill="#f0f7ec" stroke="#bfd3bf" stroke-width="1.5"/>
    <text x="575" y="310" class="sans label mute">VERSION B</text>
    <text x="574" y="348" class="serif ink" font-size="31">The export went elsewhere.</text>
    <text x="575" y="380" class="sans evidence">Run history: the export completed.</text>
    <text x="575" y="409" class="sans evidence">Receipt: old folder, not the expected folder.</text>
    <rect x="573" y="434" width="441" height="35" rx="9" fill="#dcebd9"/>
    <text x="585" y="458" class="sans decision">→ Correct the delivery folder</text>
  </g>

  <text x="48" y="523" class="sans mute" font-size="18">Two fictional versions of one ticket, based on the scripted replay. No AI model ran in this example.</text>
</svg>
