</main>

<script>
  const comparisons = JSON.parse(document.getElementById('traces').textContent);
  const model = document.getElementById('model');
  const scenario = document.getElementById('scenario');
  const element = (tag, text, style) => {
    const result = document.createElement(tag);
    if (text !== undefined) result.textContent = text;
    if (style) result.className = style;
    return result;
  };
  const resultLabel = (before, after) => before === after ? 'Same outcome' : after === 'success' ? 'Gain' : before === 'success' ? 'Regression' : 'Different failure';
  const count = (metrics) => `${metrics.successes} / ${metrics.attempted}`;
  const signedPoints = (delta) => `${delta > 0 ? '+' : ''}${(100 * delta).toFixed(1)} pp`;

  function chooseModel() {
    const selected = comparisons[model.value];
    scenario.replaceChildren(...selected.base.map((before, index) => {
      const after = selected.adapted[index];
      return new Option(`${index + 1}. ${resultLabel(before.verdict.outcome, after.verdict.outcome)} · ${before.opening.customer_message}`, index);
    }));
    const firstGain = selected.adapted.findIndex((after, index) => after.verdict.outcome === 'success' && selected.base[index].verdict.outcome !== 'success');
    if (firstGain >= 0) scenario.selectedIndex = firstGain;
    show();
  }

  function show() {
    const selected = comparisons[model.value];
    const index = Number(scenario.value);
    const numbers = selected.scorecard;
    const [lower, upper] = numbers.bootstrap_95_interval;
    document.getElementById('ticket').textContent = selected.base[index].opening.customer_message;
    document.getElementById('verdict').textContent = `${signedPoints(numbers.primary_delta)} evidence-backed success (${signedPoints(lower)} to ${signedPoints(upper)}; 95% paired interval). Unsupported recommendation episodes: ${numbers.base.unsupported_claims} → ${numbers.adapted.unsupported_claims}.`;
    document.getElementById('arms').replaceChildren(...['base', 'adapted'].map((arm) => {
      const entry = selected[arm][index];
      const metrics = numbers[arm];
      const article = element('article');
      article.append(element('h2', arm === 'base' ? 'Adapter off' : 'Adapter on'), element('div', count(metrics), 'metric'),
        element('p', `This case: ${entry.verdict.outcome}. ${entry.verdict.reason}`));
      entry.turns.forEach((turn, turnIndex) => {
        const details = element('details');
        const action = turn.action?.action;
        const name = [action, turn.action?.source ?? turn.action?.finding ?? turn.action?.fact].filter(Boolean).join(' · ');
        details.append(element('summary', `${turnIndex + 1}. ${name || 'Unrecognized reply'}`),
          element('p', turn.result.value ?? turn.result.error ?? (turn.result.accepted_terminal ? 'Final action accepted for grading.' : 'Record unavailable.')),
          element('pre', `${turn.raw}\n\n${JSON.stringify(turn.result, null, 2)}`));
        article.append(details);
      });
      return article;
    }));
  }

  for (const [key, value] of Object.entries(comparisons)) model.add(new Option(value.label, key));
  model.addEventListener('change', chooseModel);
  scenario.addEventListener('change', show);
  chooseModel();
</script>
</html>
